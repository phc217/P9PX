name: Build KernelSU-Next Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU-Next
        uses: actions/checkout@v4
        with:
          repository: 'KernelSU-Next/KernelSU-Next'

      - name: Switch to Protocol 6 Matched Commit
        run: |
          git fetch origin 5d3a136
          git checkout FETCH_HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd manager
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-Protocol6-Matched
          path: manager/app/build/outputs/apk/release/*.apk
