name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # 1. 检出工作流配置仓库
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置编译环境
      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd repo

      # 3. 同步内核源码
      - name: Sync Kernel Source
        run: |
          # 请确保此处写有你同步/下载内核源码至 common 目录的命令
          echo "Syncing kernel source code into common directory..."

      # 4. 集成 KernelSU-Next 并锁死 v3.4.2 稳定版 (Protocol 5)
      - name: Integrate KernelSU-Next (Locked to Stable v3.4.2)
        run: |
          # 独立克隆 KernelSU-Next 源码并切换至 v3.4.2 稳定 Tag
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KSU-Next-Source
          cd KSU-Next-Source
          git fetch --tags
          git checkout v3.4.2
          cd "$GITHUB_WORKSPACE"

          # 明确指定内核根目录为 common
          KERNEL_ROOT="common"

          if [ ! -d "$KERNEL_ROOT/drivers" ]; then
            echo "[ERROR] 未能找到 $KERNEL_ROOT/drivers 目录！"
            echo "请检查第 3 步是否配置了将内核源码拉取至 common 目录的命令。"
            exit 1
          fi

          echo "定位内核源码根目录: $KERNEL_ROOT"

          # 注入 KernelSU-Next v3.4.2 驱动源码
          mkdir -p "$KERNEL_ROOT/drivers/ksu"
          cp -r KSU-Next-Source/kernel/* "$KERNEL_ROOT/drivers/ksu/"
          rm -rf KSU-Next-Source

          # 挂载 Kconfig 与 Makefile 引用
          if ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Makefile"; then
            echo 'obj-$(CONFIG_KSU) += ksu/' >> "$KERNEL_ROOT/drivers/Makefile"
          fi
          if ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Kconfig"; then
            sed -i '/endmenu/i source "drivers/ksu/Kconfig"' "$KERNEL_ROOT/drivers/Kconfig"
          fi

          echo "KernelSU-Next v3.4.2 驱动已成功集成至 $KERNEL_ROOT/drivers/ksu ！"

      # 5. 应用 SUSFS 补丁
      - name: Apply SUSFS Patches
        run: |
          echo "Applying SUSFS patches..."
          # 保留你原本的 SUSFS 打补丁脚本命令

      # 6. 编译内核
      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 保留你原本编译 Pixel 9 Pro XL GKI 内核的命令

      # 7. 上传内核产物
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 替换为你实际编译产物的路径
