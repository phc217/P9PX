name: Build Pixel 9 Pro XL (Android 16) GKI Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 清理与释放 Ubuntu 磁盘空间及配置环境
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc libncurses-dev zip lld patch libncurses6 libtinfo6 wget

          # 安装 Ubuntu 官方原生 libtinfo5 与 libncurses5，彻底解决 llvm-nm 运行依赖
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i libtinfo5_6.2-0ubuntu2_amd64.deb libncurses5_6.2-0ubuntu2_amd64.deb || sudo apt-get -f install -y
          rm -f *.deb

      - name: 2. 拉取 Google 官方 ACK 内核源码 (GKI 6.1 适配 Pixel 9 Pro XL)
        run: |
          git clone --depth=1 -b android14-6.1 https://android.googlesource.com/kernel/common android-kernel

      - name: 3. 集成 KernelSU-Next
        run: |
          cd android-kernel
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf $(pwd)/KernelSU-Next/kernel drivers/kernelsu
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 4. 打入 SUSFS 稳定版补丁与配置
        run: |
          cd android-kernel
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs || git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          # 1. 复制 SUSFS 核心头文件与 fs 源码
          cp -r susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          cp -r susfs/kernel_patches/fs/* fs/ 2>/dev/null || true

          # 2. 应用内核代码 Patch
          KPATH=$(find susfs/kernel_patches/ -name "*6.1*.patch" | head -n 1)
          if [ -f "$KPATH" ]; then
            echo "Applying Kernel Patch: $KPATH"
            patch -p1 < "$KPATH" || true
          fi

          # 3. 应用 KernelSU-Next 代码 Patch
          KSUPATH=$(find susfs/ -name "*ksu*.patch" -o -name "*KernelSU*.patch" -o -name "*next*.patch" | head -n 1)
          if [ -f "$KSUPATH" ]; then
            echo "Applying KSU Patch: $KSUPATH"
            patch -p1 -d KernelSU-Next < "$KSUPATH" || true
          fi

          # 4. 补全 fs/Makefile 编译项
          if ! grep -q "susfs.o" fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

          # 5. 写入内核宏开关
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/gki_defconfig

      - name: 5. 精准递归检出 Clang 并编译 Kernel（保留单线程 -j1 降级捕获）
        run: |
          # 使用目录递归通配符 clang-r510928/ 确保完整拉取 bin/ 与 lib64/
          mkdir -p llvm-clang
          cd llvm-clang
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          echo "clang-r510928/" > .git/info/sparse-checkout
          git pull --depth=1 origin main
          cd ..
          
          CLANG_BIN="$(pwd)/llvm-clang/clang-r510928/bin"
          CLANG_LIB="$(pwd)/llvm-clang/clang-r510928/lib64"
          
          if [ ! -f "$CLANG_BIN/llvm-nm" ]; then
            echo "错误：未能在目标路径找到 llvm-nm！解压文件列表如下："
            ls -la llvm-clang/
            exit 1
          fi
          
          export PATH="$CLANG_BIN:$PATH"
          export LD_LIBRARY_PATH="$CLANG_LIB:$LD_LIBRARY_PATH"
          
          echo "=================== 工具链状态测试 ==================="
          "$CLANG_BIN/llvm-nm" --version
          echo "======================================================"

          cd android-kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export AR=llvm-ar
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          make O=out gki_defconfig
          
          # 多线程编译；若失败则自动切单线程 (-j1) 定格精准报错行
          if ! make -j$(nproc) O=out Image; then
            echo "========================================================================="
            echo "多线程编译中断！正在自动切换为单线程 (make -j1) 精准捕获报错代码文件..."
            echo "========================================================================="
            make -j1 O=out Image
          fi

      - name: 6. 查找并打包成品内核
        run: |
          IMAGE_PATH=$(find android-kernel -name "Image" -type f | head -n 1)
          if [ -n "$IMAGE_PATH" ]; then
            echo "找到内核镜像路径: $IMAGE_PATH"
            cp "$IMAGE_PATH" ./Image
            zip -r9 Pixel9ProXL-Android16-GKI-KSU-SUSFS.zip Image
          else
            echo "未在产物目录中找到 Image 文件！"
            exit 1
          fi

      - name: 7. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Android16-GKI-Kernel
          path: |
            Image
            Pixel9ProXL-Android16-GKI-KSU-SUSFS.zip
