name: Build Pixel 9 Pro XL (Android 16) GKI Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 清理与释放 Ubuntu 磁盘空间及配置环境
        run: |
          # 强力清理虚拟机预装无用软件，释放 30GB+ 空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc libncurses-dev zip lld

      - name: 2. 拉取 Google 官方 ACK 内核源码 (GKI 6.1 适配 Pixel 9 Pro XL)
        run: |
          git clone --depth=1 -b android14-6.1 https://android.googlesource.com/kernel/common android-kernel

      - name: 3. 集成 KernelSU-Next
        run: |
          cd android-kernel
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 4. 打入 SUSFS 稳定版补丁与配置
        run: |
          cd android-kernel
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          # 复制 SUSFS 核心内核头文件与源码
          cp -r susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          cp -r susfs/kernel_patches/fs/* fs/ 2>/dev/null || true

          # 写入 KSU + SUSFS 内核编译开关
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/gki_defconfig

      - name: 5. 精准稀疏检出 Clang 编译器并编译 Kernel
        run: |
          # 使用现代 git sparse-checkout 完整拉取 clang-r510928 及其所有二进制工具
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 llvm-clang
          cd llvm-clang
          git sparse-checkout set clang-r510928
          cd ..
          
          # 导入编译路径
          export PATH=$(pwd)/llvm-clang/clang-r510928/bin:$PATH
          
          cd android-kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          make O=out gki_defconfig
          make -j$(nproc) O=out Image

      - name: 6. 打包成品内核
        run: |
          cp android-kernel/out/arch/arm64/boot/Image ./
          zip -r9 Pixel9ProXL-Android16-GKI-KSU-SUSFS.zip Image

      - name: 7. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Android16-GKI-Kernel
          path: |
            Image
            Pixel9ProXL-Android16-GKI-KSU-SUSFS.zip
