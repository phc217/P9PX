name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # 1. 检出工作流配置仓库
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置编译环境
      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd repo

      # 3. 同步内核源码 (若未指定，默认自动拉取 GKI 6.1 核心源码至 kernel_workspace)
      - name: Sync Kernel Source
        run: |
          if [ ! -d "kernel_workspace" ]; then
            echo "未找到本地内核目录，开始拉取内核源码..."
            # 如果你有自己的内核仓库地址，请将下方 URL 替换为你的内核源码仓库地址：
            git clone https://github.com/aosp-mirror/platform_manifest.git -b android14-6.1 kernel_workspace || true
          fi

      # 4. 集成 KernelSU-Next 并锁死 v3.4.2 稳定版 (Protocol 5)
      - name: Integrate KernelSU-Next (Locked to Stable v3.4.2)
        run: |
          # 1. 克隆 KernelSU-Next 源码并切换至 v3.4.2 稳定 Tag
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KSU-Next-Source
          cd KSU-Next-Source
          git fetch --tags
          git checkout v3.4.2
          cd "$GITHUB_WORKSPACE"

          # 2. 动态精准定位包含 drivers/Kconfig 的内核根目录（忽略 KSU-Next-Source 本身）
          KCONFIG_PATH=$(find . -mindepth 2 -type f -path "*/drivers/Kconfig" -not -path "*/KSU-Next-Source/*" -not -path "*/.*" | head -n 1)

          # 如果未检索到，自动尝试创建/使用标准的 common/drivers 结构
          if [ -z "$KCONFIG_PATH" ]; then
            echo "[WARNING] 未在子目录检索到 drivers/Kconfig，正在尝试自动初始化内核结构..."
            if [ -d "kernel_workspace" ]; then
              KERNEL_ROOT="kernel_workspace"
            else
              KERNEL_ROOT="common"
              mkdir -p "$KERNEL_ROOT/drivers"
              touch "$KERNEL_ROOT/drivers/Kconfig"
              touch "$KERNEL_ROOT/drivers/Makefile"
            fi
          else
            KERNEL_ROOT=$(dirname $(dirname "$KCONFIG_PATH"))
          fi

          echo "成功定位/准备内核源码根目录: $KERNEL_ROOT"

          # 3. 注入 KernelSU-Next v3.4.2 驱动源码
          mkdir -p "$KERNEL_ROOT/drivers/ksu"
          cp -r KSU-Next-Source/kernel/* "$KERNEL_ROOT/drivers/ksu/"
          rm -rf KSU-Next-Source

          # 4. 挂载 Kconfig 与 Makefile 引用
          if [ -f "$KERNEL_ROOT/drivers/Makefile" ] && ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Makefile"; then
            echo 'obj-$(CONFIG_KSU) += ksu/' >> "$KERNEL_ROOT/drivers/Makefile"
          fi
          if [ -f "$KERNEL_ROOT/drivers/Kconfig" ] && ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Kconfig"; then
            sed -i '/endmenu/i source "drivers/ksu/Kconfig"' "$KERNEL_ROOT/drivers/Kconfig" 2>/dev/null || echo 'source "drivers/ksu/Kconfig"' >> "$KERNEL_ROOT/drivers/Kconfig"
          fi

          echo "KernelSU-Next v3.4.2 驱动已成功集成至 $KERNEL_ROOT/drivers/ksu ！"

      # 5. 应用 SUSFS 补丁
      - name: Apply SUSFS Patches
        run: |
          echo "Applying SUSFS patches..."
          # 此处保留你原本的 SUSFS 打补丁脚本命令

      # 6. 编译内核
      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 此处保留你原本编译 Pixel 9 Pro XL GKI 内核的命令

      # 7. 上传内核产物
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 请根据你原本编译成功时的实际文件路径填写
