name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd

      - name: Integrate KernelSU-Next (Lock to Latest Stable Release)
        run: |
          # 1. 运行官方 setup 脚本拉取基础驱动源码
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -
          
          # 2. 精准切换到最新稳定 Tag (避免拉到 dev/开发版驱动)
          cd KernelSU-Next
          git fetch --tags
          
          # 自动筛选去除 -rc/-dev 等预发布后缀的最新稳定版本 (当前为 v3.4.2)
          LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "-" | sort -V | tail -n 1)
          TARGET_TAG=${LATEST_STABLE_TAG:-v3.4.2}
          
          echo "Targeting KernelSU-Next Stable Tag: $TARGET_TAG"
          git checkout $TARGET_TAG
          cd ..

      - name: Apply SUSFS & Custom Kernel Patches
        run: |
          # 此处保留你之前调试好的 SUSFS 补丁打入命令
          echo "Applying SUSFS patches..."

      - name: Compile Kernel
        run: |
          # 此处保留你之前调试好的 GKI / Pixel 9 Pro XL 内核编译命令
          echo "Compiling Kernel..."

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 根据你之前的产物路径匹配
