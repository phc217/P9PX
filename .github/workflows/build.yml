name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd

      - name: Download Kernel Source Code
        run: |
          # 假设这里是你原先拉取 Pixel 9 Pro XL 内核源码的步骤
          # 例如: repo init / git clone ...
          echo "Syncing/Cloning kernel source..."

      - name: Integrate KernelSU-Next (Lock to Latest Stable Release)
        run: |
          # 自动定位内核源码中的 drivers 目录
          MAKEFILE_PATH=$(find . -type f -path "*/drivers/Makefile" -not -path "*/.*" | head -n 1)

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "[ERROR] 未能定位到 drivers/ 目录，请检查内核源码拉取步骤！"
            exit 1
          fi

          KERNEL_DIR=$(dirname $(dirname "$MAKEFILE_PATH"))
          echo "Targeting kernel root dir: $KERNEL_DIR"
          cd "$KERNEL_DIR"

          # 1. 运行官方 setup 脚本接入 KSU-Next
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

          # 2. 精准锁定为最新稳定 Release Tag (v3.4.2 / Protocol 5)
          cd KernelSU-Next
          git fetch --tags
          LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "-" | sort -V | tail -n 1)
          TARGET_TAG=${LATEST_STABLE_TAG:-v3.4.2}

          echo "Checkout KernelSU-Next Tag: $TARGET_TAG"
          git checkout $TARGET_TAG

          cd "$GITHUB_WORKSPACE"

      - name: Apply SUSFS Patches
        run: |
          echo "Applying SUSFS patches..."
          # 原有的 SUSFS 打补丁命令

      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 原有的 GKI 编译命令

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4
