name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd

      - name: Integrate KernelSU-Next (Lock to Latest Stable Release)
        run: |
          # 自动定位包含 drivers/ 目录的内核源码路径
          if [ -d "drivers" ]; then
            KERNEL_DIR="."
          elif [ -d "common/drivers" ]; then
            KERNEL_DIR="common"
          elif [ -d "kernel/drivers" ]; then
            KERNEL_DIR="kernel"
          else
            KERNEL_DIR=$(find . -maxdepth 2 -type d -name "drivers" | head -n 1 | xargs dirname)
          fi

          echo "Targeting kernel root dir: $KERNEL_DIR"
          cd "$KERNEL_DIR"

          # 1. 运行官方 setup 脚本将 KSU-Next 接入内核源码树
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

          # 2. 精准切换驱动至最新稳定 Release Tag (锁定 v3.4.2 / Protocol 5)
          cd KernelSU-Next
          git fetch --tags

          # 自动过滤 -rc / -dev 等后缀，提取最新正式稳定 Tag
          LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "-" | sort -V | tail -n 1)
          TARGET_TAG=${LATEST_STABLE_TAG:-v3.4.2}

          echo "Checkout KernelSU-Next Tag: $TARGET_TAG"
          git checkout $TARGET_TAG

          # 退回 Actions 根目录
          cd "$GITHUB_WORKSPACE"

      - name: Apply SUSFS & Custom Kernel Patches
        run: |
          echo "Applying SUSFS patches..."
          # 此处保持你原有的 SUSFS 补丁打入命令

      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 此处保持你原有的 GKI 内核编译命令

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 根据你实际产物路径配置
