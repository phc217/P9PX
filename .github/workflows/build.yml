name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd repo

      - name: Sync / Download Kernel Source
        run: |
          echo "Syncing kernel source code..."
          # 注意：请确保此处保留你原有的 repo init/sync 或 git clone 命令
          # 如果你的内核源码直接就在仓库根目录， actions/checkout 已经下载完毕，可无视此段

      - name: Integrate KernelSU-Next (Lock to Latest Stable Release)
        run: |
          # 1. 打印工作区结构以便诊断
          echo "=== 当前工作区目录结构 ==="
          find . -maxdepth 3 -not -path '*/.*'

          # 2. 自动寻找包含 drivers 文件夹的内核源码根目录
          KERNEL_DIR=""
          if [ -d "drivers" ]; then
            KERNEL_DIR="."
          else
            DRIVERS_PATH=$(find . -maxdepth 3 -type d -name "drivers" -not -path '*/.*' | head -n 1)
            if [ -n "$DRIVERS_PATH" ]; then
              KERNEL_DIR=$(dirname "$DRIVERS_PATH")
            fi
          fi

          if [ -z "$KERNEL_DIR" ]; then
            echo "======================================================="
            echo "[ERROR] 工作区内未发现 drivers 目录！"
            echo "请检查在上一步骤中内核源码是否成功下载到了 runner 空间。"
            echo "======================================================="
            exit 1
          fi

          echo "成功定位内核源码目录: $KERNEL_DIR"
          cd "$KERNEL_DIR"

          # 3. 运行官方 setup 脚本接入 KSU-Next
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

          # 4. 精准锁定为最新稳定 Release Tag (锁定 v3.4.2 / Protocol 5)
          cd KernelSU-Next
          git fetch --tags
          
          LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "-" | sort -V | tail -n 1)
          TARGET_TAG=${LATEST_STABLE_TAG:-v3.4.2}

          echo "Checkout KernelSU-Next Tag: $TARGET_TAG"
          git checkout $TARGET_TAG

          cd "$GITHUB_WORKSPACE"

      - name: Apply SUSFS Patches
        run: |
          echo "Applying SUSFS patches..."
          # 保留你原本的 SUSFS 补丁命令

      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 保留你原本的 Pixel 9 Pro XL / GKI 编译命令

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 根据你原先打包成功的实际产物路径填写
