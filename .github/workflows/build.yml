name: Build Custom Kernel with KernelSU-Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # 1. 检出 GitHub 仓库中的工作流配置文件
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置交叉编译和工具链环境
      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev zstd repo

      # 3. 同步/下载内核源码
      - name: Sync Kernel Source
        run: |
          echo "Syncing kernel source code..."
          # 注意：请确保此处写有你下载/同步 Pixel 9 Pro XL 内核源码的原本命令 (如 repo init/sync 或 git clone)

      # 4. 集成 KernelSU-Next 并锁死 v3.4.2 稳定版 (Protocol 5)
      - name: Integrate KernelSU-Next (Locked to Stable v3.4.2)
        run: |
          # 1. 独立克隆 KernelSU-Next 源码并切换至 v3.4.2 稳定 Tag
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KSU-Next-Source
          cd KSU-Next-Source
          git fetch --tags
          git checkout v3.4.2
          cd "$GITHUB_WORKSPACE"

          # 2. 动态精准定位包含 drivers/Kconfig 的内核根目录
          KCONFIG_PATH=$(find . -maxdepth 4 -type f -path "*/drivers/Kconfig" -not -path "*/KSU-Next-Source/*" -not -path "*/.*" | head -n 1)

          if [ -z "$KCONFIG_PATH" ]; then
            echo "=========================================================================="
            echo "[ERROR] 工作区内未检索到包含 drivers/Kconfig 的内核源码路径！"
            echo "当前工作区的目录结构如下："
            ls -la
            echo "=========================================================================="
            exit 1
          fi

          # 提取内核源码根目录路径（即 drivers 的上一级目录）
          KERNEL_ROOT=$(dirname $(dirname "$KCONFIG_PATH"))
          echo "成功定位内核源码根目录: $KERNEL_ROOT"

          # 3. 注入 KernelSU-Next v3.4.2 驱动源码
          mkdir -p "$KERNEL_ROOT/drivers/ksu"
          cp -r KSU-Next-Source/kernel/* "$KERNEL_ROOT/drivers/ksu/"
          rm -rf KSU-Next-Source

          # 4. 挂载 Kconfig 与 Makefile 引用
          if ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Makefile"; then
            echo 'obj-$(CONFIG_KSU) += ksu/' >> "$KERNEL_ROOT/drivers/Makefile"
          fi
          if ! grep -q "CONFIG_KSU" "$KERNEL_ROOT/drivers/Kconfig"; then
            sed -i '/endmenu/i source "drivers/ksu/Kconfig"' "$KERNEL_ROOT/drivers/Kconfig"
          fi

          echo "KernelSU-Next v3.4.2 驱动已成功集成至 $KERNEL_ROOT/drivers/ksu ！"

      # 5. 应用 SUSFS 补丁
      - name: Apply SUSFS Patches
        run: |
          echo "Applying SUSFS patches..."
          # 保留你原本的 SUSFS 打补丁脚本命令

      # 6. 编译内核
      - name: Compile Kernel
        run: |
          echo "Compiling Kernel..."
          # 保留你原本编译 Pixel 9 Pro XL GKI 内核的命令

      # 7. 上传内核产物
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9ProXL-Kernel-KSU-Stable
          path: out/arch/arm64/boot/Image.lz4 # 请根据你原本编译成功时的实际文件路径填写
